spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: profile, email
            redirect-uri: "{baseUrl}/login/oauth2/code/google"
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

application:
  security:
    disabled: false
  # Optional admin bootstrap for a fresh deployment. Leave the password unset to disable.
  bootstrap:
    admin:
      username: ${APPLICATION_BOOTSTRAP_ADMIN_USERNAME:}
      password: ${APPLICATION_BOOTSTRAP_ADMIN_PASSWORD:}
      email: ${APPLICATION_BOOTSTRAP_ADMIN_EMAIL:}

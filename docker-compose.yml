services:
  database:
    container_name: stonemark-db
    build: ./postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: stonemark
      PGDATA: /var/lib/postgresql/data
    volumes:
      - stonemark-db:/var/lib/postgresql
    ports:
      - "5440:5432"
    networks:
      - stonemark-network
    restart: unless-stopped

networks:
  stonemark-network:
    driver: bridge

volumes:
  stonemark-db:
    driver: local

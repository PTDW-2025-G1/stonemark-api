# Processing pipeline configuration.
#
# The pipeline is opt-in: it requires a trained Vision model and an existing
# embedding corpus. While disabled, submissions are stored and moderated manually.
# Every key below is read by ProcessingProperties or an @Value in the module.
processing:
  # Master switch for the AI preprocessing/categorization pipeline.
  enabled: false

  similarity:
    # Maximum number of suggestions returned; requests above this are clamped.
    max-k: 200
    # Minimum cosine similarity for a candidate to be considered. Range 0.0 - 1.0.
    # The SQL distance threshold is derived as (1 - min-score).
    min-score: 0.6

  vision:
    # Bound on concurrent Vision API calls; work above this is deferred, not dropped.
    max-concurrency: 4
    # How long a worker waits for a Vision permit before deferring the submission.
    acquire-timeout-ms: 10000

  retry:
    # Exponential backoff base and ceiling for retrying PENDING/FAILED records.
    base-delay-ms: 60000
    max-delay-ms: 1800000
    # Retry/orphan dispatch batch size and pause between batches.
    batch-size: 5
    batch-pause-ms: 2000
    interval: 60000

  reaper:
    # Reset PROCESSING records stuck longer than this back to PENDING.
    max-stuck-minutes: 30
    interval: 3600000
